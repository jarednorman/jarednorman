#:schema https://jj-vcs.github.io/jj/latest/config-schema.json

[user]
name = "Jared Norman"
email = "jared@super.gd"

[ui]
default-command = "log"
diff-editor = ":builtin"

# Defaults: https://github.com/jj-vcs/jj/blob/main/cli/src/config/colors.toml
[colors]
"rest" = "#504945"

"commit_id" = "blue"
"working_copy commit_id" = "blue"

"change_id" = "green"
"working_copy change_id" = "green"

"author" = "#a89984"
"working_copy author" = "#a89984"

"timestamp" = "#928374"
"working_copy timestamp" = "#a89984"

"bookmarks" = "yellow"
"working_copy bookmarks" = "yellow"

"description placeholder" = "magenta"
"working_copy description placeholder" = "magenta"

"empty description placeholder" = "#928374"
"working_copy empty description placeholder" = "#928374"

"empty" = "magenta"
"working_copy empty" = "magenta"

# Word-level diff highlights: background tint instead of the default underline
"diff token" = { underline = false }
"diff removed token" = { bg = "#3c1f1e" }
"diff added token" = { bg = "#32361a" }

[aliases]
bm = ["bookmark"]

[git]
private-commits = '''description('private:*')'''
