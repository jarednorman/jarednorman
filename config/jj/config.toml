#:schema https://jj-vcs.github.io/jj/latest/config-schema.json

[user]
name = "Jared Norman"
email = "jared@super.gd"

[ui]
default-command = "log"
diff-editor = ":builtin"

# Defaults: https://github.com/jj-vcs/jj/blob/main/cli/src/config/colors.toml
[colors]
"rest" = "#585b70"

"commit_id" = "blue"
"working_copy commit_id" = "blue"

"change_id" = "green"
"working_copy change_id" = "green"

"author" = "#7f849c"
"working_copy author" = "#7f849c"

"timestamp" = "#6c7086"
"working_copy timestamp" = "#7f849c"

"bookmarks" = "yellow"
"working_copy bookmarks" = "yellow"

"description placeholder" = "magenta"
"working_copy description placeholder" = "magenta"

"empty description placeholder" = "#6c7086"
"working_copy empty description placeholder" = "#6c7086"

"empty" = "magenta"
"working_copy empty" = "magenta"

# Word-level diff highlights: background tint instead of the default underline
"diff token" = { underline = false }
"diff removed token" = { bg = "#493446" }
"diff added token" = { bg = "#394545" }

[aliases]
bm = ["bookmark"]

[git]
private-commits = '''description('private:*')'''

[templates]
# Show the diff in the `jj describe` editor, like `git commit --verbose`.
# Everything after `JJ: ignore-rest` is dropped from the final description,
# and leaving the diff unprefixed lets editors syntax-highlight it.
draft_commit_description = '''
concat(
  builtin_draft_commit_description,
  "\nJJ: ignore-rest\n",
  diff.git(),
)
'''

# The editor is plain text, so don't emit OSC-8 hyperlink escapes there.
[[--scope]]
--when.commands = ["describe"]
[--scope.template-aliases]
"hyperlink(url, text)" = "text"
